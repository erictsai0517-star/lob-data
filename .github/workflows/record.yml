name: record-lob

on:
  schedule:
    - cron: "0 */6 * * *"   # 每 6 小時自動啟動一次
  workflow_dispatch:         # 允許手動啟動（用來測試）
    inputs:
      minutes:
        description: "錄製分鐘數（測試用 3）"
        default: "3"

permissions:
  contents: write

concurrency:
  group: record
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        symbol: [adausdt, btcusdt]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install websockets

      - name: Record
        env:
          MINUTES: ${{ inputs.minutes || '300' }}
          SYMBOL: ${{ matrix.symbol }}
        run: |
          python - <<'PYEOF'
          import asyncio, csv, json, os, time
          import websockets

          L = 10
          SYMBOL = os.environ["SYMBOL"].lower()
          MINUTES = float(os.environ["MINUTES"])
          BASES = os.environ.get(
              "BASES",
              "wss://stream.binance.com:9443,wss://data-stream.binance.vision,wss://stream.binance.us:9443",
          ).split(",")
          STAMP = time.strftime("%Y%m%d_%H%M", time.gmtime())
          os.makedirs("out", exist_ok=True)


          def make_url(base, sym):
              return f"{base}/stream?streams={sym}@depth{L}@100ms/{sym}@aggTrade"


          async def probe(base, sym):
              try:
                  async with websockets.connect(make_url(base, sym), open_timeout=10) as ws:
                      await asyncio.wait_for(ws.recv(), timeout=10)
                  return True
              except Exception as e:
                  print("probe fail:", base, sym, type(e).__name__, str(e)[:100], flush=True)
                  return False


          async def main():
              syms = [SYMBOL] + ([SYMBOL[:-1]] if SYMBOL.endswith("usdt") else [])
              base = sym = None
              for b in BASES:
                  for s in syms:
                      if await probe(b, s):
                          base, sym = b, s
                          break
                  if base:
                      break
              if not base:
                  print("NO ENDPOINT REACHABLE", flush=True)
                  raise SystemExit(1)
              print("using", base, sym, flush=True)

              sf = open(f"out/{sym}_{STAMP}_snaps.csv", "w", newline="")
              tf = open(f"out/{sym}_{STAMP}_trades.csv", "w", newline="")
              sw, tw = csv.writer(sf), csv.writer(tf)
              sw.writerow(["ts"] + [f"{k}{i}" for k in ("bp", "bq", "ap", "aq") for i in range(1, L + 1)])
              tw.writerow(["ts", "price", "qty", "side"])
              end = time.time() + MINUTES * 60
              ns = nt = 0
              last = time.time()
              try:
                  while time.time() < end:
                      try:
                          async with websockets.connect(make_url(base, sym), ping_interval=20, open_timeout=10) as ws:
                              while time.time() < end:
                                  msg = await asyncio.wait_for(ws.recv(), timeout=30)
                                  now = time.time()
                                  m = json.loads(msg)
                                  d = m["data"]
                                  if "aggTrade" in m["stream"]:
                                      tw.writerow([f"{now:.3f}", d["p"], d["q"], -1 if d["m"] else 1])
                                      nt += 1
                                  else:
                                      b, a = d["bids"], d["asks"]
                                      if len(b) < L or len(a) < L:
                                          continue
                                      sw.writerow([f"{now:.3f}"] + [x[0] for x in b] + [x[1] for x in b]
                                                  + [x[0] for x in a] + [x[1] for x in a])
                                      ns += 1
                                  if now - last > 60:
                                      sf.flush(); tf.flush(); last = now
                                      if ns % 600 < 20:
                                          print(f"{ns} snaps, {nt} trades", flush=True)
                      except Exception as e:
                          print("reconnect:", type(e).__name__, str(e)[:100], flush=True)
                          await asyncio.sleep(3)
              finally:
                  sf.close(); tf.close()
                  print(f"done: {ns} snaps, {nt} trades", flush=True)


          asyncio.run(main())
          PYEOF

      - name: Save data
        if: always()
        run: |
          shopt -s nullglob
          files=(out/*.csv)
          if [ ${#files[@]} -eq 0 ]; then echo "no data"; exit 0; fi
          gzip -f out/*.csv
          mkdir -p data
          mv out/*.gz data/
          git config user.name "recorder"
          git config user.email "recorder@users.noreply.github.com"
          git add data
          git commit -m "data ${{ matrix.symbol }} $(date -u +%F_%H%M)" || exit 0
          for i in 1 2 3 4 5 6; do
            git pull --rebase && git push && break
            sleep $((RANDOM % 15 + 5))
          done
