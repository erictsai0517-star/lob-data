name: record-lob

on:
  schedule:
    - cron: "0 * * * *"     # 每小時排一次隊；配合 concurrency，前一輪一結束，排隊中的下一輪就接著跑
  workflow_dispatch:         # 允許手動啟動（用來測試）
    inputs:
      minutes:
        description: "錄製分鐘數（測試用 3）"
        default: "3"

permissions:
  contents: write            # 建立 Release、上傳檔案需要

concurrency:
  group: record
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        symbol: [btcusdt, ethusdt]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install websockets pyarrow

      - name: Record
        env:
          MINUTES: ${{ inputs.minutes || '335' }}
          SYMBOL: ${{ matrix.symbol }}
          PART_MIN: "60"
        run: |
          python - <<'PYEOF'
          import asyncio, json, os, time
          import pyarrow as pa
          import pyarrow.parquet as pq
          import websockets

          L = 10
          SYMBOL = os.environ["SYMBOL"].lower()
          MINUTES = float(os.environ["MINUTES"])
          PART_MIN = float(os.environ.get("PART_MIN", "60"))
          BASES = os.environ.get(
              "BASES",
              "wss://data-stream.binance.vision,wss://stream.binance.com:9443",
          ).split(",")
          STAMP = time.strftime("%Y%m%d_%H%M", time.gmtime())
          os.makedirs("out", exist_ok=True)

          SNAP_NAMES = ["ts", "u"] + [f"{k}{i}" for k in ("bp", "bq", "ap", "aq") for i in range(1, L + 1)]
          SNAP = pa.schema([("ts", pa.float64()), ("u", pa.int64())]
                           + [(n, pa.float64()) for n in SNAP_NAMES[2:]])
          TRADE = pa.schema([("ts", pa.float64()), ("T", pa.int64()), ("a", pa.int64()),
                             ("price", pa.float64()), ("qty", pa.float64()), ("side", pa.int8())])
          EVENT = pa.schema([("ts", pa.float64()), ("msg", pa.string())])


          class Part:
              def __init__(self, name, schema):
                  self.name, self.schema = name, schema
                  self.rows, self.idx = [], 0

              def add(self, row):
                  self.rows.append(row)

              def flush(self):
                  if not self.rows:
                      return
                  self.idx += 1
                  cols = list(zip(*self.rows))
                  table = pa.Table.from_arrays(
                      [pa.array(list(c), type=f.type) for c, f in zip(cols, self.schema)],
                      schema=self.schema,
                  )
                  pq.write_table(table, f"out/{SYMBOL}_{STAMP}_{self.name}_p{self.idx:03d}.parquet",
                                 compression="zstd")
                  self.rows = []


          def make_url(base):
              return f"{base}/stream?streams={SYMBOL}@depth{L}@100ms/{SYMBOL}@aggTrade"


          async def probe(base):
              try:
                  async with websockets.connect(make_url(base), open_timeout=10) as ws:
                      await asyncio.wait_for(ws.recv(), timeout=10)
                  return True
              except Exception as e:
                  print("probe fail:", base, SYMBOL, type(e).__name__, str(e)[:100], flush=True)
                  return False


          async def main():
              base = None
              for b in BASES:
                  if await probe(b):
                      base = b
                      break
              if not base:
                  print("NO ENDPOINT REACHABLE", flush=True)
                  raise SystemExit(1)
              print("using", base, SYMBOL, flush=True)

              snaps, trades, events = Part("snaps", SNAP), Part("trades", TRADE), Part("events", EVENT)
              parts = (snaps, trades, events)
              start = time.time()
              end = start + MINUTES * 60
              next_flush = start + PART_MIN * 60
              last_log = start
              ns = nt = 0
              events.add((start, "start"))
              try:
                  while time.time() < end:
                      try:
                          async with websockets.connect(make_url(base), ping_interval=20, open_timeout=10) as ws:
                              events.add((time.time(), "connected"))
                              while time.time() < end:
                                  msg = await asyncio.wait_for(ws.recv(), timeout=30)
                                  now = time.time()
                                  m = json.loads(msg)
                                  d = m["data"]
                                  if "aggTrade" in m["stream"]:
                                      trades.add((now, int(d["T"]), int(d["a"]),
                                                  float(d["p"]), float(d["q"]), -1 if d["m"] else 1))
                                      nt += 1
                                  else:
                                      b, a = d["bids"], d["asks"]
                                      if len(b) < L or len(a) < L:
                                          continue
                                      snaps.add((now, int(d["lastUpdateId"]))
                                                + tuple(float(x[0]) for x in b) + tuple(float(x[1]) for x in b)
                                                + tuple(float(x[0]) for x in a) + tuple(float(x[1]) for x in a))
                                      ns += 1
                                  if now >= next_flush:
                                      for p in parts:
                                          p.flush()
                                      next_flush = now + PART_MIN * 60
                                  if now - last_log > 300:
                                      last_log = now
                                      print(f"{ns} snaps, {nt} trades", flush=True)
                      except Exception as e:
                          events.add((time.time(), f"disconnect:{type(e).__name__}"))
                          print("reconnect:", type(e).__name__, str(e)[:100], flush=True)
                          await asyncio.sleep(3)
              finally:
                  events.add((time.time(), "end"))
                  for p in parts:
                      p.flush()
                  print(f"done: {ns} snaps, {nt} trades", flush=True)


          asyncio.run(main())
          PYEOF

      - name: Upload data to Release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(out/*.parquet)
          if [ ${#files[@]} -eq 0 ]; then echo "no data"; exit 0; fi
          TAG="data-$(date -u +%Y%m%d)"
          gh release create "$TAG" --title "$TAG" --notes "LOB raw data (parquet)" || true
          for i in 1 2 3 4 5; do
            gh release upload "$TAG" "${files[@]}" --clobber && break
            sleep $((RANDOM % 15 + 5))
          done
